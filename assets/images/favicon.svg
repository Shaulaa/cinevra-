<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141317"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="gold" x1="14" y1="12" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2cf7a"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
  </defs>

  <!-- background: rounded square, dark, sedikit gradient -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- "C" berbentuk lingkaran terbuka (aperture kamera) -->
  <path d="M 46.57 40.76 A 17 17 0 1 1 46.57 23.24"
        fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- ujung segitiga "play" yang mengisi celah C, seolah C ini "memutar" film -->
  <path d="M 51.95 32 L 42.95 26.6 L 42.95 37.4 Z" fill="url(#gold)"/>
</svg>
