<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="14" y1="12" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2cf7a"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
