    <path d="M 51.95 32 L 42.95 26.6 L 42.95 37.4 Z" fill="url(#gold)"/>
  </g>

  <!-- wordmark -->
  <text x="70" y="42" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600" fill="#f2f1ee">Cine<tspan fill="url(#gold)">vra</tspan></text>
