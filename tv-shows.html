<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Shows - Cinevra</title>

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css">
  <!-- pakai movies.css lagi karena layout filter bar & grid-nya identik -->
  <link rel="stylesheet" href="css/movies.css">
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <a href="index.html" class="navbar__logo"><img src="assets/images/favicon.svg" alt="" class="navbar__logo-icon"><span class="navbar__logo-text">Cine<span>vra</span></span></a>

    <nav class="navbar__links" id="navLinks">
      <a href="index.html" data-page="index.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5"></path><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path></svg>
        <span>Home</span>
      </a>
      <a href="movies.html" data-page="movies.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"></path></svg>
        <span>Movies</span>
      </a>
      <a href="tv-shows.html" data-page="tv-shows.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 18v3"></path></svg>
        <span>TV Shows</span>
      </a>
      <a href="watchlist.html" data-page="watchlist.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v16l-7-4-7 4V5z"></path></svg>
        <span>Lists</span>
      </a>
    </nav>

    <form class="navbar__search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search movies, actors, genres..." aria-label="Search">
      <button type="button" class="navbar__search-close" id="searchCloseBtn" aria-label="Tutup pencarian">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="navbar__search-results" id="navSearchResults"></div>
    </form>

    <a href="watchlist.html" class="navbar__watchlist-link">Watchlist</a>

    <div class="navbar__mobile-actions">
      <button class="navbar__mobile-search-btn" id="mobileSearchBtn" type="button" aria-label="Cari">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button class="navbar__toggle" id="navToggle" type="button" aria-label="Buka menu" aria-expanded="false">
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>
    </div>
  </header>

  <div class="navbar__backdrop" id="navBackdrop"></div>

  <main class="container">

    <!-- ================= LIST HERO ================= -->
    <section class="list-hero" id="listHero">
      <div class="list-hero__content">
        <span class="list-hero__eyebrow">TV Show Discovery</span>
        <h1 class="list-hero__title" id="pageTitle">Popular TV Shows</h1>
        <p class="list-hero__subtitle" id="pageSubtitle">Jelajahi serial TV dari seluruh dunia, dari drama sampai animasi</p>
      </div>
    </section>

    <!-- ================= FILTER BAR ================= -->
    <div class="filter-bar">
      <div class="multi-select" id="genreMultiSelect">
        <button type="button" class="multi-select__toggle" id="genreToggle">
          <span id="genreToggleLabel">All Genres</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="multi-select__panel" id="genrePanel"></div>
      </div>

      <select class="filter-select" id="yearFilter">
        <option value="">All Years</option>
      </select>

      <select class="filter-select" id="sortFilter">
        <option value="popularity.desc">Sort by: Popularity</option>
        <option value="vote_average.desc">Sort by: Rating</option>
        <option value="first_air_date.desc">Sort by: Newest</option>
        <option value="first_air_date.asc">Sort by: Oldest</option>
      </select>

      <span class="filter-bar__count" id="resultCount"></span>
    </div>

    <!-- ================= GRID ================= -->
    <section class="movies-grid-section">
      <div class="card-grid" id="tvGrid"></div>

      <div class="state-block" id="emptyState" style="display:none;">
        <svg class="state-block__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <h2 class="state-block__title">TV Show tidak ditemukan</h2>
        <p class="state-block__desc">Coba ubah filter genre atau urutan yang kamu pakai.</p>
      </div>

      <div class="load-more-wrap">
        <button class="btn btn--outline" id="loadMoreBtn" type="button">Load More</button>
        <label class="infinite-scroll-toggle">
          <input type="checkbox" id="infiniteScrollToggle">
          <span class="infinite-scroll-toggle__track"><span class="infinite-scroll-toggle__thumb"></span></span>
          <span class="infinite-scroll-toggle__label">Auto-load saat scroll</span>
        </label>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="site-footer__brand">Cinevra</span>
      <span class="site-footer__note">Dibuat untuk tugas Pemrograman Web 1 &middot; Data TV Show oleh TMDB</span>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/tv-shows.js"></script>
</body>
</html>
