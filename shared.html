<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared List - Cinevra</title>
  <meta name="description" content="View a shared movie and TV show list on Cinevra">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Cinevra">
  <meta property="og:title" content="Shared List - Cinevra">
  <meta property="og:description" content="View a shared movie and TV show list on Cinevra">
  <meta property="og:image" content="assets/images/image.png">

  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/shared.css">
</head>
<body>

  <noscript>
    <div class="noscript-banner">
      Cinevra needs JavaScript to show movies and TV shows. Enable JavaScript in your browser, then reload the page.
    </div>
  </noscript>

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <a href="index.html" class="navbar__logo"><img src="assets/images/favicon.svg" alt="" class="navbar__logo-icon"><span class="navbar__logo-text">Cine<span>vra</span></span></a>

    <nav class="navbar__links" id="navLinks" aria-label="Main navigation">
      <a href="index.html" data-page="index.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5"></path><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path></svg>
        <span>Home</span>
      </a>
      <a href="movies.html" data-page="movies.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"></path></svg>
        <span>Movies</span>
      </a>
      <a href="tv-shows.html" data-page="tv-shows.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 18v3"></path></svg>
        <span>TV Shows</span>
      </a>
      <a href="watchlist.html" data-page="watchlist.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5c0-1.1.9-2 2-2h10a2 2 0 0 1 2 2v16l-7-4-7 4V5z"></path></svg>
        <span>Lists</span>
      </a>
      <a href="my-space.html" data-page="my-space.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
        <span>My Space</span>
      </a>
      <a href="community.html" data-page="community.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>
        <span>Community</span>
      </a>
      <a href="account.html" class="navbar__account-mobile" data-page="account.html">
        <svg class="navbar__links-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
        <span>My account</span>
      </a>
    </nav>

    <form class="navbar__search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search movies, actors, genres..." aria-label="Search">
      <button type="button" class="navbar__search-close" id="searchCloseBtn" aria-label="Close search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="navbar__search-results" id="navSearchResults"></div>
    </form>

    <button class="navbar__surprise-btn" id="surpriseMeBtn" type="button" aria-label="Surprise Me, pick something to watch">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <circle cx="8.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="15.5" cy="8.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="8.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="15.5" cy="15.5" r="1.4" fill="currentColor" stroke="none"></circle>
        <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle>
      </svg>
      <span class="navbar__surprise-btn-text">Surprise Me</span>
    </button>

    <div class="navbar__mobile-actions">
      <button class="navbar__mobile-search-btn" id="mobileSearchBtn" type="button" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button class="navbar__toggle" id="navToggle" aria-controls="navLinks" type="button" aria-label="Open menu" aria-expanded="false">
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>
    </div>

    <div class="navbar__account" id="accountSlot"></div>
  </header>

  <div class="navbar__backdrop" id="navBackdrop"></div>

  <main class="container">

    <!-- ================= SHARED LIST HEADER ================= -->
    <div class="shared-header" id="sharedHeader" hidden>
      <h1 class="page-title" id="sharedTitle">Loading...</h1>
      <p class="page-subtitle" id="sharedMeta"></p>
      <p class="shared-description" id="sharedDescription" hidden></p>
      <button class="btn btn--primary" id="importListBtn" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Save to My Lists
      </button>
    </div>

    <!-- ================= GRID ================= -->
    <div class="card-grid" id="sharedGrid"></div>

    <!-- ================= ERROR STATE ================= -->
    <div class="state-block" id="errorState" hidden>
      <svg class="state-block__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <h2 class="state-block__title" id="errorTitle">Invalid link</h2>
      <p class="state-block__desc" id="errorDesc">This shared list link is not valid or has expired.</p>
      <a href="index.html" class="btn btn--primary">Back to Home</a>
    </div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="site-footer__brand">Cinevra</span>
      <span class="site-footer__note">Built for a Web Programming 1 assignment &middot; Movie data by TMDB</span>
      <a class="site-footer__privacy" href="privacy.html">Privacy Policy</a>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/vendor/supabase-2.118.0.js"></script>
  <script src="js/cloud-store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/library.js"></script>
  <script src="js/image-export.js"></script>
  <script src="js/shared.js"></script>
</body>
</html>
